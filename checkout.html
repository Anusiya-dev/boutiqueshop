      <div class="form-row">

      <div class="form-group"><label>Email Address</label><input type="email" placeholder="priya@email.com" /></div>

      <div class="form-group"><label>Address</label><input type="text" placeholder="House / Flat No., Street" /></div>
      <div class="form-row">
        <div class="form-group"><label>City</label><input type="text" placeholder="Chennai" /></div>
        <div class="form-group"><label>PIN Code</label><input type="text" placeholder="600001" /></div>
      </div>
      <div class="form-group">
        <label>State</label>
        <select>
          <option>Tamil Nadu</option>
          <option>Maharashtra</option>
          <option>Karnataka</option>
          <option>Delhi</option>
          <option>West Bengal</option>
          <option>Gujarat</option>
        </select>
      </div>

      <div class="section-gap">
        <p class="form-section-title">Payment Method</p>
        <div class="payment-options">
          <button class="pay-option selected" onclick="selectPay(this)">UPI</button>
          <button class="pay-option" onclick="selectPay(this)">Debit Card</button>
          <button class="pay-option" onclick="selectPay(this)">Net Banking</button>
          <button class="pay-option" onclick="selectPay(this)">COD</button>
        </div>
        <div class="form-group"><label>UPI ID</label><input type="text" placeholder="yourname@upi" /></div>
      </div>

      <button class="place-order-btn" onclick="placeOrder()">Place Order</button>
    </div>

    <!-- ORDER SUMMARY -->
    <div class="order-summary">
      <h2>Your Order</h2>
      <div id="summaryItems"></div>
      <hr class="summary-divider" />
      <div class="summary-total"><span>Total</span><span id="summaryTotal">₹0</span></div>
    </div>
  </div>

  <!-- SUCCESS POPUP -->
  <div class="success-overlay" id="successOverlay">
    <div class="success-box">
      <div class="success-icon"><i class="fas fa-check-circle"></i></div>
      <h2>Order Placed!</h2>
      <p>Thank you for shopping with FLORA. Your order has been confirmed and will be delivered in 3–5 business days.
      </p>
      <a href="index.html" onclick="clearCart()">Back to Home</a>
    </div>
  </div>

  <script>
    function getCart() { return JSON.parse(localStorage.getItem('auraCart')) || []; }

    function renderSummary() {
      var cart = getCart();
      var total = 0;
      var html = '';
      cart.forEach(function (item) {
        var t = item.price * item.qty;
        total += t;
        html += '<div class="summary-item"><span>' + item.name + ' x' + item.qty + '</span><span>₹' + t.toLocaleString() + '</span></div>';
      });
      var shipping = total >= 999 ? 0 : 99;
      if (shipping > 0) {
        html += '<div class="summary-item"><span>Shipping</span><span>₹99</span></div>';
      } else {
        html += '<div class="summary-item"><span>Shipping</span><span>Free</span></div>';
      }
      document.getElementById('summaryItems').innerHTML = html;
      document.getElementById('summaryTotal').textContent = '₹' + (total + shipping).toLocaleString();
    }

    function selectPay(btn) {
      document.querySelectorAll('.pay-option').forEach(function (b) { b.classList.remove('selected'); });
      btn.classList.add('selected');
    }

    function placeOrder() {
      document.getElementById('successOverlay').classList.add('show');
    }

    function clearCart() {
      localStorage.removeItem('auraCart');
    }

    renderSummary();
  </script>

  <script>
    const hamburger = document.querySelector('.hamburger');
    const navLinks = document.querySelector('.nav-links');
    if (hamburger && navLinks) {
      hamburger.addEventListener('click', () => {
        navLinks.classList.toggle('active');
      });
    }
  </script>
  <!-- Bootstrap JS Bundle -->
