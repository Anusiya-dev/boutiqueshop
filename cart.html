  <script>
    function getCart() { return JSON.parse(localStorage.getItem('auraCart')) || []; }
    function saveCart(cart) { localStorage.setItem('auraCart', JSON.stringify(cart)); }

    function renderCart() {
      var cart = getCart();
      var container = document.getElementById('cartItems');
      var total = 0;

      // Update nav count 
      var count = cart.reduce(function (s, i) { return s + i.qty; }, 0);
      document.getElementById('cartCount').textContent = count;

      if (cart.length === 0) {
        container.innerHTML = '<div class="empty-cart"><i class="fas fa-shopping-bag"></i><p>Your cart is empty.</p><a href="shop.html">Shop Now</a></div>';
        document.getElementById('subtotal').textContent = '₹0';
        document.getElementById('totalAmt').textContent = '₹0';
        document.getElementById('checkoutBtn').style.opacity = '0.5';
        document.getElementById('checkoutBtn').style.pointerEvents = 'none';
        return;
      }

      var html = '';
      cart.forEach(function (item, index) {
        var itemTotal = item.price * item.qty;
        total += itemTotal;
        html += '<div class="cart-item">' +
        '<div class="item-img">' + (item.img 
        ? '<img src="' + item.img + '" alt="' + item.name + '" style="width:100%;height:100%;object-fit:cover;border-radius:4px;">' 
        : '<i class="fas fa-shirt" style="font-size:2rem;color:var(--rose);"></i>') +
         '</div>' +
          '<div class="item-info">' +
          '<p class="item-name">' + item.name + '</p>' +
          '<p class="item-price">₹' + item.price.toLocaleString() + ' each</p>' +
          '</div>' +
          '<div class="item-controls">' +
          '<button class="qty-btn" onclick="changeQty(' + index + ',-1)">−</button>' +
          '<span class="qty-num">' + item.qty + '</span>' +
          '<button class="qty-btn" onclick="changeQty(' + index + ',1)">+</button>' +
          '</div>' +
          '<span class="item-total">₹' + itemTotal.toLocaleString() + '</span>' +
          '<button class="remove-btn" onclick="removeItem(' + index + ')"><i class="fas fa-times"></i></button>' +
          '</div>';
      });
      container.innerHTML = html;

      var shipping = total >= 999 ? 'Free' : '₹99';
      var finalTotal = total >= 999 ? total : total + 99;
      document.getElementById('subtotal').textContent = '₹' + total.toLocaleString();
      document.getElementById('shipping').textContent = shipping;
      document.getElementById('totalAmt').textContent = '₹' + finalTotal.toLocaleString();
    }

    function changeQty(index, change) {
      var cart = getCart();
      cart[index].qty += change;
      if (cart[index].qty <= 0) { cart.splice(index, 1); }
      saveCart(cart);
      renderCart();
    }

    function removeItem(index) {
      var cart = getCart();
      cart.splice(index, 1);
      saveCart(cart);
      renderCart();
    }

    renderCart();
  </script>

  <script>
